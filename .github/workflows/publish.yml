name: Build Chat Widget

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    # Allow the default GITHUB_TOKEN to push the rebuilt dist/ back to main.
    # Previous PAT-based approach (secrets.DISPATCH_TOKEN) broke when the
    # token value picked up a stray character, splitting the `git remote
    # set-url` arg line and producing `error: unknown option 'repo'`.
    # GITHUB_TOKEN is ambient, can't drift, and the [skip ci] commit
    # message keeps this from looping.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Commit and push built files
        run: |
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes to dist/, skipping commit"
          else
            git commit -m "chore: update dist [skip ci]"
            git push origin main
          fi
