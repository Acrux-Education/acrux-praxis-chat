name: Build Chat Widget

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    # Only this workflow's own dist commit may skip the rebuild loop. A user
    # commit message cannot bypass release-integrity verification.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Allow the default GITHUB_TOKEN to push the rebuilt dist/ back to main.
    # Previous PAT-based approach (secrets.DISPATCH_TOKEN) broke when the
    # token value picked up a stray character, splitting the `git remote
    # set-url` arg line and producing `error: unknown option 'repo'`.
    # GITHUB_TOKEN is ambient, can't drift, and the [skip ci] commit
    # message keeps this from looping.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify immutable release assets
        run: npm run verify:release

      - name: Lint
        run: npm run lint

      - name: Commit and push built files
        run: |
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes to dist/, skipping commit"
          else
            git commit -m "chore: update dist [skip ci]"
            git push origin main
          fi
