name: Build Chat Widget

on:
  push:
    branches:
      - main

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Commit built files
        run: |
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes to dist/, skipping commit"
          else
            git commit -m "chore: update dist [skip ci]"
            git push origin main
          fi

      - name: Trigger consumer update in acrux-praxis-fe
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: Acrux-Education/acrux-praxis-fe
          event-type: chat-widget-update
