version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "20:00"
      timezone: "Australia/Perth"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      majors:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Blocked on PLATDEV-828: typescript-eslint peer range is typescript <6.1.0, and TS 7.0 has no JS compiler API until 7.1; remove when it clears
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
